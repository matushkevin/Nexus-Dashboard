<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nexus Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg:       #0a0a0b;
    --surface:  #111114;
    --border:   #1e1e24;
    --border2:  #2a2a32;
    --accent:   #f0a500;
    --accent2:  #ff5c3a;
    --text:     #e8e8ec;
    --muted:    #6b6b7a;
    --green:    #2dd4a0;
    --red:      #ff4d6d;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 28px 0;
    flex-shrink: 0;
  }
  .logo {
    padding: 0 24px 32px;
    border-bottom: 1px solid var(--border);
  }
  .logo-mark {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .logo-mark span { color: var(--accent); }
  .logo-sub {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .nav { padding: 24px 12px; flex: 1; }
  .nav-section {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 12px;
    margin-bottom: 8px;
    margin-top: 20px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    transition: all 0.15s;
    border: 1px solid transparent;
  }
  .nav-item:hover { color: var(--text); background: var(--border); }
  .nav-item.active {
    color: var(--accent);
    background: rgba(240,165,0,0.07);
    border-color: rgba(240,165,0,0.15);
  }
  .nav-icon { font-size: 14px; width: 18px; text-align: center; }
  .sidebar-footer {
    padding: 20px 24px;
    border-top: 1px solid var(--border);
  }
  .user-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: #000;
    flex-shrink: 0;
  }
  .user-name { font-size: 11px; color: var(--text); }
  .user-role { font-size: 10px; color: var(--muted); }

  /* ── Main ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .page-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
  }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .date-badge {
    background: var(--border);
    border: 1px solid var(--border2);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11px;
    color: var(--muted);
  }
  .btn-refresh {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 7px 16px;
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-refresh:hover { opacity: 0.85; }

  /* ── Content ── */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ── Stat Cards ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .stat-card:hover::before { opacity: 1; }
  .stat-card:hover { border-color: var(--border2); }
  .stat-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .stat-value {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1;
  }
  .stat-change {
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .stat-change.up { color: var(--green); }
  .stat-change.down { color: var(--red); }
  .stat-icon {
    position: absolute;
    right: 18px; top: 18px;
    font-size: 22px;
    opacity: 0.12;
  }

  /* ── Charts Row ── */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .card-title {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
  }
  .card-badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(240,165,0,0.1);
    color: var(--accent);
    border: 1px solid rgba(240,165,0,0.2);
  }
  .chart-wrap {
    position: relative;
    height: 220px;
  }

  /* ── Products ── */
  .product-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .product-row:last-child { border-bottom: none; }
  .product-name { font-size: 12px; flex: 1; color: var(--text); }
  .product-rev { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .product-bar-wrap {
    width: 80px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .product-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 1s ease;
  }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  thead th {
    text-align: left;
    padding: 0 12px 12px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    font-weight: 400;
  }
  tbody td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(255,255,255,0.02); }
  .order-id { color: var(--muted); font-size: 11px; }
  .status {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 10px;
  }
  .status.Delivered  { background: rgba(45,212,160,0.1); color: var(--green); }
  .status.Shipped    { background: rgba(240,165,0,0.1);  color: var(--accent); }
  .status.Processing { background: rgba(100,100,200,0.1);color: #8888ff; }
  .status.Cancelled  { background: rgba(255,77,109,0.1); color: var(--red); }

  /* ── Loading ── */
  .loading {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    padding: 40px;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">NEX<span>US</span></div>
    <div class="logo-sub">Analytics v1.0</div>
  </div>
  <nav class="nav">
    <div class="nav-section">Main</div>
    <div class="nav-item active"><span class="nav-icon">◈</span> Overview</div>
    <div class="nav-item"><span class="nav-icon">◎</span> Revenue</div>
    <div class="nav-item"><span class="nav-icon">◻</span> Orders</div>
    <div class="nav-item"><span class="nav-icon">◯</span> Customers</div>
    <div class="nav-section">Manage</div>
    <div class="nav-item"><span class="nav-icon">▷</span> Products</div>
    <div class="nav-item"><span class="nav-icon">⋯</span> Reports</div>
    <div class="nav-item"><span class="nav-icon">◇</span> Settings</div>
  </nav>
  <div class="sidebar-footer">
    <div class="user-row">
      <div class="avatar">VN</div>
      <div>
        <div class="user-name">Vin</div>
        <div class="user-role">Administrator</div>
      </div>
    </div>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <div class="topbar">
    <div class="page-title">Overview</div>
    <div class="topbar-right">
      <div class="date-badge" id="currentDate">—</div>
      <button class="btn-refresh" onclick="loadAll()">↻ Refresh</button>
    </div>
  </div>

  <div class="content">

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="loading">Loading stats…</div>
    </div>

    <!-- Charts row -->
    <div class="charts-row">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Revenue — Last 12 Months</div>
          <div class="card-badge">Monthly</div>
        </div>
        <div class="chart-wrap">
          <canvas id="revenueChart"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">Top Products</div>
          <div class="card-badge">By Revenue</div>
        </div>
        <div id="productsList"><div class="loading">Loading…</div></div>
      </div>
    </div>

    <!-- Orders table -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Recent Orders</div>
        <div class="card-badge" id="orderCount">—</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Amount (KES)</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr><td colspan="5" class="loading">Loading orders…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<script>
// Date
document.getElementById('currentDate').textContent =
  new Date().toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});

let revenueChartInst = null;

async function loadStats() {
  const res = await fetch('/api/stats');
  const data = await res.json();
  const icons = { revenue:'◈', orders:'◻', customers:'◯', refunds:'◇' };
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = Object.entries(data).map(([k, v]) => `
    <div class="stat-card">
      <div class="stat-label">${k}</div>
      <div class="stat-value">${v.value}</div>
      <div class="stat-change ${v.up ? 'up' : 'down'}">
        ${v.up ? '▲' : '▼'} ${v.change} vs last period
      </div>
      <div class="stat-icon">${icons[k] || '◈'}</div>
    </div>
  `).join('');
}

async function loadRevenue() {
  const res = await fetch('/api/revenue');
  const data = await res.json();
  const ctx = document.getElementById('revenueChart').getContext('2d');
  if (revenueChartInst) revenueChartInst.destroy();
  revenueChartInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.map(d => d.month),
      datasets: [{
        label: 'Revenue (KES)',
        data: data.map(d => d.revenue),
        backgroundColor: data.map((_, i) =>
          i === data.length - 1 ? '#f0a500' : 'rgba(240,165,0,0.2)'),
        borderColor: data.map((_, i) =>
          i === data.length - 1 ? '#f0a500' : 'rgba(240,165,0,0.4)'),
        borderWidth: 1,
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#111114',
          borderColor: '#2a2a32',
          borderWidth: 1,
          titleColor: '#6b6b7a',
          bodyColor: '#e8e8ec',
          callbacks: {
            label: ctx => ` KES ${ctx.raw.toLocaleString()}`
          }
        }
      },
      scales: {
        x: { grid: { color: '#1e1e24' }, ticks: { color: '#6b6b7a', font: { family: 'DM Mono', size: 10 } } },
        y: { grid: { color: '#1e1e24' }, ticks: { color: '#6b6b7a', font: { family: 'DM Mono', size: 10 },
          callback: v => 'KES ' + (v/1000).toFixed(0) + 'k' } }
      }
    }
  });
}

async function loadProducts() {
  const res = await fetch('/api/products');
  const data = await res.json();
  document.getElementById('productsList').innerHTML = data.map(p => `
    <div class="product-row">
      <div class="product-name">${p.name}</div>
      <div class="product-bar-wrap">
        <div class="product-bar" style="width:${p.pct}%"></div>
      </div>
      <div class="product-rev">KES ${p.revenue.toLocaleString()}</div>
    </div>
  `).join('');
}

async function loadOrders() {
  const res = await fetch('/api/orders');
  const data = await res.json();
  document.getElementById('orderCount').textContent = `${data.length} orders`;
  document.getElementById('ordersBody').innerHTML = data.map(o => `
    <tr>
      <td class="order-id">${o.id}</td>
      <td>${o.customer}</td>
      <td style="color:var(--muted)">${o.date}</td>
      <td>KES ${o.amount.toLocaleString()}</td>
      <td><span class="status ${o.status}">${o.status}</span></td>
    </tr>
  `).join('');
}

async function loadAll() {
  await Promise.all([loadStats(), loadRevenue(), loadProducts(), loadOrders()]);
}

loadAll();
</script>
</body>
</html>
